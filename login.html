<!DOCTYPE html>
<html data-flow-release="a1eac5050a421f3a" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#163f35">
    <title>Sign in | Flow</title>
    <link rel="manifest" href="manifest.webmanifest?v=882cbb09a1dc67c1">
    <link rel="icon" type="image/svg+xml" href="assets/flow-icon.svg?v=52d47154a08e23b9">
    <link rel="apple-touch-icon" href="assets/flow-icon-192.png?v=78f93f2dc35f7bbf">
    <link rel="stylesheet" href="css/styles.css?v=a854bef0a3b6ed9b">
    <link rel="stylesheet" href="css/app.css?v=e1fd8e3d6cb14f8b">
    <link rel="stylesheet" href="css/auth.css?v=73756a2ac1c382dd">
    <script src="js/storage.js?v=2f7e2302da412706" defer></script>
    <script src="js/app-offline.js?v=314d8d989dd5f718" defer></script>
    <script src="vendor/supabase.min.js?v=bee24fc29228ed5a" integrity="sha384-UagCvVPT5XXA0Hx+nJYUAGBFseHT9zBgpJMSebsAxl9lciTwbT+39j5VfRjdP5Tp" crossorigin="anonymous" defer></script>
    <script src="js/cloud-config.js?v=88e7e9526b908c52" defer></script>
    <script src="js/auth-storage.js?v=af54d07b8b0f115a" defer></script>
    <script src="js/cloud-sync.js?v=bc499d89d93c7f20" defer></script>
    <script src="js/auth-gate.js?v=c63f01e100da7b0e" defer></script>
    <script src="js/login.js?v=3cf03f2e8803f050" defer></script>
    <link rel="stylesheet" href="css/brand.css?v=02ec8d815aea327c">
    <link rel="stylesheet" href="css/experience.css?v=da7f40b7ca3dde1d">
</head>
<body class="login-page">
    <main class="login-card">
        <a href="login.html" class="flow-wordmark" aria-label="Flow sign-in"><img src="assets/flow-logo.png?v=59e60a4060dd5454" alt="Flow." width="280" height="124"></a>
        <h1 id="login-title">Welcome to Flow.</h1>
        <p id="login-description">Enter your email to get a sign-in code.</p>
        <form id="login-form">
            <label for="login-email">Email address</label>
            <input id="login-email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required>
            <button class="save-button" type="submit">Continue</button>
        </form>
        <section id="login-sent" hidden>
            <p id="login-email-summary"></p>
            <form id="login-code-form">
                <label for="login-code">Sign-in code</label>
                <input id="login-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" autocapitalize="none" spellcheck="false" required aria-describedby="login-message">
                <button class="save-button" type="submit">Sign in</button>
            </form>
            <div class="login-code-actions">
                <button id="login-change-email" class="text-button" type="button">Change email</button>
                <button id="login-resend" class="text-button" type="button">Send a new code</button>
            </div>
        </section>
        <p id="login-message" role="status" aria-live="polite"></p>
        <p class="login-remember">You’ll stay signed in on this device.</p>
        <details id="login-diagnostics" class="login-troubleshooting" hidden>
            <summary>Sign-in status</summary>
            <button id="login-check-status" class="secondary-button" type="button">Check sign-in status</button>
            <p id="login-status-details" role="status"></p>
        </details>
        <a class="login-demo" href="demo/index.html">Explore Flow with sample data</a>
    </main>
</body>
</html>
