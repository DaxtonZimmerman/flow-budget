[functions.plaid]
verify_jwt = true

# Plaid cannot send a Flow user JWT. The handler verifies Plaid's signed payload.
[functions.plaid-webhook]
verify_jwt = false

# Production has a separate endpoint so its signature is checked with Production keys.
[functions.plaid-production-webhook]
verify_jwt = false

# Supabase Auth signs each request. The handler verifies it before sending email.
[functions.flow-auth-email]
verify_jwt = false

# Local development templates. Hosted Supabase uses the matching dashboard templates.
[auth.email.template.magic_link]
subject = "Your Flow sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your Flow sign-in code"
content_path = "./supabase/templates/sign-in-code.html"
